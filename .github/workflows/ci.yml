name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install frontend/tooling dependencies
        run: npm ci

      - name: Install GCP API dependencies
        run: npm ci --prefix api

      - name: Frontend TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: GCP API strict TypeScript check
        run: npm run typecheck:api

      - name: Unit and migration foundation tests
        run: npm test

      - name: Build GCP API artifact
        run: npm run build:api

      - name: Build frontend
        run: npx vite build

      - name: Validar artefato
        run: node ./scripts/generate-page-og-html.mjs && node ./scripts/validate-deploy-artifact.mjs ./dist
