name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install frontend/tooling dependencies
        run: npm ci

      - name: Install GCP API dependencies
        run: npm ci --prefix api

      - name: Frontend TypeScript check
        run: npx tsc --noEmit

      - name: GCP API strict TypeScript check
        run: npm run typecheck:api

      - name: Unit and migration foundation tests
        run: npm test

      - name: Build GCP API artifact
        run: npm run build:api

      - name: Build frontend
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDrdt32oOHC86aXqGxm7QC1HpbmH4H2VJk"
          VITE_FIREBASE_AUTH_DOMAIN: "revhackers-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "revhackers-staging"
          VITE_GOOGLE_AUTH_ENABLED: "true"
          VITE_GCP_API_URL: "https://revhackers-api-staging-3na73syj5a-rj.a.run.app"
          VITE_GCP_ENABLED: "true"
          VITE_CLIENTS_GCP_ENABLED: "true"
          VITE_GROWTHMAP_GCP_ENABLED: "true"
        run: npx vite build
