name: Deploy Automático Hostinger (FTPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirmacao manual: digite PUBLICAR (suspenso ate correcao dos valores de staging, OP-02)"
        required: true
        type: string
      motivo:
        description: "Motivo/registro da publicacao manual"
        required: true
        type: string

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build & Deploy para Hostinger
    # Trava OP-02 (temporaria): job desabilitado em QUALQUER evento,
    # inclusive dispatch manual com PUBLICAR.
    # Reativacao (somente via PR, apos corrigir/validar valores de producao):
    # trocar por: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Validar confirmacao manual (fail-closed)
        env:
          CONFIRM: ${{ inputs.confirm }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          if [ "$CONFIRM" != "PUBLICAR" ]; then
            echo "Deploy manual BLOQUEADO: confirmacao invalida. Publicacao suspensa ate correcao dos valores de staging (OP-02)."
            exit 1
          fi
          echo "Publicacao manual confirmada. Motivo: $MOTIVO"

      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Build de Produção (GCP Native Stack)
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDrdt32oOHC86aXqGxm7QC1HpbmH4H2VJk"
          VITE_FIREBASE_AUTH_DOMAIN: "revhackers-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "revhackers-staging"
          VITE_GOOGLE_AUTH_ENABLED: "true"
          VITE_GCP_API_URL: "https://revhackers-api-staging-3na73syj5a-rj.a.run.app"
          VITE_GCP_ENABLED: "true"
          VITE_CLIENTS_GCP_ENABLED: "true"
          VITE_GROWTHMAP_GCP_ENABLED: "true"
        run: npx vite build

      - name: Deploy via SFTP para Hostinger
        env:
          SSH_HOST: "151.106.98.30"
          SSH_PORT: "65002"
          SSH_USERNAME: "u139274360"
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DIR: "/home/u139274360/domains/revhackers.com.br/public_html"
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Configure o Secret HOSTINGER_SSH_PRIVATE_KEY}"

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          install -m 700 -d "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          [151.106.98.30]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGzcHcn75uvWs5rxDQEpS2ylTjLAfuvPt7W7cwICOKFh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

          rsync --archive --compress --human-readable --itemize-changes \
            -e "ssh -i $key_file -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./dist/ "$SSH_USERNAME@$SSH_HOST:$SSH_REMOTE_DIR/"
