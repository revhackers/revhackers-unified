  <!-- Auto-reload handler for deploy chunk updates (prevents white screens) -->
  <script>
    (function() {
      function killGhlWidget() {
        try {
          var selectors = [
            'chat-widget', '#chat-widget', '#leadconnector-chat-widget',
            '.hl-chat-widget', '#hl-chat-widget-container', '[id*="chat-widget"]',
            '[class*="chat-widget"]', '[id*="leadconnector"]', '[class*="leadconnector"]',
            'iframe[src*="leadconnector"]', 'iframe[src*="widget.leadconnectorhq"]', 'iframe[src*="msgsndr"]'
          ];
          for (var i = 0; i < selectors.length; i++) {
            var targets = document.querySelectorAll(selectors[i]);
            for (var j = 0; j < targets.length; j++) {
              targets[j].remove();
            }
          }
        } catch(e) {}
      }
      if (typeof window !== 'undefined') {
        window.addEventListener('DOMContentLoaded', killGhlWidget);
        setInterval(killGhlWidget, 200);
        var obs = new MutationObserver(killGhlWidget);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();

    // Catch script 404s (stale deployment asset hashes)
    window.addEventListener('error', function(e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        var src = e.target.src || e.target.href || '';
        if (src.indexOf('/assets/') !== -1) {
          var lastFix = parseInt(sessionStorage.getItem('rev_stale_asset_reload') || '0', 10);
          if (Date.now() - lastFix > 2000) {
            sessionStorage.setItem('rev_stale_asset_reload', String(Date.now()));
            var url = new URL(window.location.href);
            url.searchParams.set('_v', String(Date.now()));
            window.location.replace(url.toString());
          }
        }
      }
    }, true);
  </script>
